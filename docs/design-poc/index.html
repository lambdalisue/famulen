<head>

<title>Famulen コンソールの PoC</title>
<script>// Before anything is drawn, so a chosen theme never flashes. The system's own needs no attribute.
try { const t = localStorage.getItem("famulen-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else if (t === "system") delete document.documentElement.dataset.theme; } catch { /* the system's */ }</script>
<style>
/*
 * Every color, size and shadow the console is drawn with. A color names both
 * themes at once (light, dark); `color-scheme` picks which one, so the system's
 * choice needs no script and a manual choice only sets data-theme.
 */
:root {
  color-scheme: light dark;

  /* Ground and surfaces, from the back to the front. */
  --bg: light-dark(#F3F4F7, #0D0F16);
  --chat-bg: light-dark(#FAFAFC, #10131B);
  --surface: light-dark(#FFFFFF, #171A24);
  --sunken: light-dark(#F0F1F5, #11141C);
  --raised: light-dark(#FFFFFF, #1F2330);
  --hover: light-dark(#F5F6F9, #1D212D);
  --pressed: light-dark(#E7E9EF, #282D3B);

  /* Text. Night ink on light, the brand's cream on dark. */
  --text: light-dark(#171A25, #ECE7DC);
  --text-2: light-dark(#434958, #C6C4BF);
  --muted: light-dark(#5B6172, #A0A2AC);

  /* Lines: between rows, around a card, around a control. */
  --line-soft: light-dark(#ECEEF2, #222634);
  --line: light-dark(#DFE2E9, #2B3040);
  --control: light-dark(#7C8292, #767D90);

  /* Cream is the secretary's: what they wrote up, and what they ask. */
  --aide: light-dark(#FFFAF0, #201E1B);
  --aide-line: light-dark(#EADFC8, #3D382F);
  --aide-ink: light-dark(#665433, #D9C8A4);

  /* What a state means, never only by color. */
  --info: light-dark(#1B5BA7, #8DBBF2);
  --info-soft: light-dark(#E9F1FB, #16263B);
  --info-line: light-dark(#BFD6F1, #2A4568);
  --ok: light-dark(#23703C, #86CF9B);
  --ok-soft: light-dark(#E8F4EB, #152B1E);
  --ok-line: light-dark(#BDDDC6, #28503A);
  --warn: light-dark(#85500A, #EBB868);
  --warn-soft: light-dark(#FDF3E0, #30240F);
  --warn-line: light-dark(#EBCF9D, #5A431C);
  --danger: light-dark(#AC2B26, #F2998F);
  --danger-soft: light-dark(#FCEDEB, #381B1B);
  --danger-line: light-dark(#F0C6C1, #683130);
  --danger-solid: light-dark(#B3312B, #F2998F);
  --on-danger: light-dark(#FFFFFF, #2E0B09);

  /* Chart series. */
  --c1: light-dark(#2E6FC0, #6EA5E8);
  --c2: light-dark(#C8622B, #E2915E);
  --c3: light-dark(#2B8A63, #62BD95);
  --c4: light-dark(#A68416, #CDAF4C);

  --shade: light-dark(rgb(13 15 22 / .38), rgb(0 0 0 / .6));
  --shadow-1: 0 1px 2px light-dark(rgb(16 20 36 / .07), rgb(0 0 0 / .4));
  --shadow-2: 0 2px 4px light-dark(rgb(16 20 36 / .05), rgb(0 0 0 / .3)), 0 8px 20px light-dark(rgb(16 20 36 / .09), rgb(0 0 0 / .4));
  --shadow-3: 0 4px 8px light-dark(rgb(16 20 36 / .06), rgb(0 0 0 / .3)), 0 20px 48px light-dark(rgb(16 20 36 / .18), rgb(0 0 0 / .55));

  /* Type. The system's own Japanese face; nothing is downloaded. */
  --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  --mincho: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono", monospace;
  --heading: var(--sans);
  --heading-weight: 650;
  --t-xs: .75rem;
  --t-sm: .8125rem;
  --t-base: .875rem;
  --t-md: .9375rem;
  --t-lg: 1.0625rem;
  --t-xl: 1.375rem;
  --t-2xl: 1.625rem;
  --lh-ui: 1.5;
  --lh-prose: 1.8;
  --measure: 40em;

  /* Room, in steps of four. */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;

  /* Corners, all from one size: a control's. */
  --r: 8px;
  --r-sm: calc(var(--r) * .75);
  --r-lg: calc(var(--r) * 1.5);
  --r-full: 999px;

  /* Density. */
  --ctl: 36px;
  --ctl-sm: 32px;
  --row: 12px;
  --hit: 44px;
  --fast: 120ms ease-out;
  --slow: 200ms cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* The accent: what can be pressed, what is picked. Bottle green unless chosen. */
:root, :root[data-accent="green"] {
  --accent: light-dark(#14665C, #63C2B1);
  --accent-hover: light-dark(#0E5249, #7BD0C1);
  --on-accent: light-dark(#FFFFFF, #06231E);
  --accent-text: light-dark(#0F5F55, #7BD0C1);
  --accent-soft: light-dark(#E6F2EF, #12302C);
  --accent-line: light-dark(#B4D5CE, #265049);
}
:root[data-accent="indigo"] {
  --accent: light-dark(#35499A, #98A9F2);
  --accent-hover: light-dark(#293A80, #ACBAF6);
  --on-accent: light-dark(#FFFFFF, #0E1533);
  --accent-text: light-dark(#31438F, #ACBAF6);
  --accent-soft: light-dark(#ECEFFA, #1C2442);
  --accent-line: light-dark(#C3CBEB, #36406F);
}
:root[data-accent="plum"] {
  --accent: light-dark(#7A3560, #DB9DC2);
  --accent-hover: light-dark(#632A4E, #E4B0CF);
  --on-accent: light-dark(#FFFFFF, #2B0F20);
  --accent-text: light-dark(#712F58, #E4B0CF);
  --accent-soft: light-dark(#F8EDF4, #35202C);
  --accent-line: light-dark(#E2C4D6, #5C384C);
}

/* The workgroup's own color marks where one is, and presses nothing. */
:root { --wg: var(--accent); --wg-work: light-dark(#2766B8, #7FB2F0); --wg-home: light-dark(#B8511C, #EB9A68); }
:root[data-wg="work"] { --wg: var(--wg-work); }
:root[data-wg="home"] { --wg: var(--wg-home); }

:root[data-radius="small"] { --r: 4px; }
:root[data-radius="large"] { --r: 12px; }
:root[data-density="compact"] { --ctl: 32px; --ctl-sm: 28px; --row: 8px; --t-base: .8125rem; --t-md: .875rem; --lh-prose: 1.7; }
:root[data-density="roomy"] { --ctl: 40px; --ctl-sm: 36px; --row: 16px; --t-base: .9375rem; --t-md: 1rem; }
:root[data-heading="mincho"] { --heading: var(--mincho); --heading-weight: 600; }
*, ::before, ::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--t-base)/var(--lh-ui) var(--sans); -webkit-font-smoothing: antialiased; text-size-adjust: 100%; line-break: strict; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--accent-text); text-underline-offset: 3px; }
h1, h2, h3, h4, p, dl, dd, ul, ol, figure, pre { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { font-family: var(--heading); font-weight: var(--heading-weight); line-height: 1.35; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: var(--t-xl); }
h2 { font-size: var(--t-lg); }
h3 { font-size: var(--t-md); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); color: var(--accent-text); }
.i { flex: none; width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.stack-lg { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
.muted { color: var(--muted); }
.sm { font-size: var(--t-sm); }
.xs { font-size: var(--t-xs); }
.mono { font-family: var(--mono); font-size: .93em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.cut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Buttons: one primary to a view. A hit area reaches 44px on touch. */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--ctl); padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--text); font-weight: 500; font-size: var(--t-base); line-height: 1.3; text-decoration: none; white-space: nowrap; box-shadow: var(--shadow-1); transition: background var(--fast), border-color var(--fast); }
.btn:hover { background: var(--hover); border-color: var(--control); }
.btn:active { background: var(--pressed); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); box-shadow: none; }
.btn.soft:hover { border-color: var(--accent-line); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); box-shadow: none; }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger-line); }
.btn.danger-solid { background: var(--danger-solid); border-color: transparent; color: var(--on-danger); }
.btn.sm { min-height: var(--ctl-sm); padding: 0 10px; font-size: var(--t-sm); }
.btn.icon { width: var(--ctl); padding: 0; }
.btn.icon.sm { width: var(--ctl-sm); }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.btn.busy .i { animation: spin 1s linear infinite; }
@keyframes spin { to { rotate: 1turn; } }

/* Fields. */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > .label { font-weight: 600; font-size: var(--t-sm); }
.field > .help { font-size: var(--t-xs); color: var(--muted); }
.field > .err { display: flex; gap: 4px; align-items: center; font-size: var(--t-xs); color: var(--danger); }
.input { width: 100%; min-width: 0; min-height: var(--ctl); padding: 0 12px; border: 1px solid var(--control); border-radius: var(--r); background: var(--surface); font-size: var(--t-base); transition: border-color var(--fast); }
.input::placeholder { color: var(--muted); opacity: 1; }
.input:hover { border-color: var(--text-2); }
.input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.input:disabled { background: var(--sunken); color: var(--muted); }
textarea.input { padding: 8px 12px; min-height: 84px; line-height: var(--lh-prose); resize: vertical; }
.select { position: relative; display: inline-flex; min-width: 0; }
.select > select { appearance: none; min-height: var(--ctl); padding: 0 30px 0 12px; border: 1px solid var(--control); border-radius: var(--r); background: var(--surface); font-size: var(--t-sm); box-shadow: var(--shadow-1); cursor: pointer; max-width: 100%; }
.select > select:hover { border-color: var(--text-2); }
.select > .i { position: absolute; right: 10px; top: 50%; translate: 0 -50%; width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
.search { position: relative; flex: 1 1 200px; min-width: 0; }
.search > .i { position: absolute; left: 11px; top: 50%; translate: 0 -50%; color: var(--muted); width: 16px; height: 16px; }
.search > .input { padding-left: 34px; box-shadow: var(--shadow-1); }
.check { display: inline-flex; align-items: center; gap: var(--s2); min-height: var(--ctl-sm); cursor: pointer; font-size: var(--t-sm); }
.check > input { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.switch { position: relative; flex: none; width: 38px; height: 22px; margin: 0; appearance: none; border-radius: var(--r-full); background: var(--control); cursor: pointer; transition: background var(--fast); }
.switch::before { content: ""; position: absolute; inset: -11px -3px; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: translate var(--slow); }
.switch:checked { background: var(--accent); }
.switch:checked::after { translate: 16px 0; background: var(--on-accent); }

/* One choice out of a few. */
.segs { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r); background: var(--pressed); max-width: 100%; }
.seg { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: calc(var(--ctl) - 6px); padding: 0 12px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: var(--t-sm); white-space: nowrap; text-decoration: none; transition: background var(--fast), color var(--fast); }
.seg:hover { color: var(--text); }
.seg[aria-pressed="true"], .seg[aria-checked="true"], .seg[aria-current="page"] { background: light-dark(var(--surface), #3A4052); color: var(--text); font-weight: 600; box-shadow: var(--shadow-1); }
.seg.only { padding: 0 8px; }

/* Cards, lists. A card is for what stands alone; rows share one frame. */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); min-width: 0; }
.card.pad { padding: var(--s4) calc(var(--s4) + 2px); }
.card-head { display: flex; align-items: center; gap: var(--s2); min-height: 44px; padding: var(--s1) var(--s2) var(--s1) var(--s4); }
.card-head > h2 { font-size: var(--t-base); letter-spacing: 0; flex: 1; min-width: 0; }
.card-head > .i { color: var(--muted); width: 17px; height: 17px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; }
.item { position: relative; display: flex; align-items: flex-start; gap: var(--s3); padding: var(--row) var(--s4); border-top: 1px solid var(--line-soft); min-width: 0; }
.item:first-child { border-top: 0; }
.item.mid { align-items: center; }
.item:has(> .main > .pick):hover { background: var(--hover); }
.item.on { background: var(--accent-soft); }
.item.on:has(> .main > .pick):hover { background: var(--accent-soft); }
.item > .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .t { font-weight: 500; font-size: var(--t-base); line-height: 1.5; }
.item .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--s2); font-size: var(--t-xs); color: var(--muted); }
.pick { border: 0; padding: 0; background: none; text-align: left; color: inherit; text-decoration: none; }
.pick::after { content: ""; position: absolute; inset: 0; }
.pick:focus-visible { outline: none; }
.pick:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: inherit; }
.item :is(.btn, .circle, .switch) { position: relative; z-index: 1; }
.circle { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.75px solid var(--control); background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.circle::after { content: ""; position: absolute; inset: -11px; }
.circle:hover { border-color: var(--accent); color: var(--accent-text); }
.circle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.circle > .i { width: 14px; height: 14px; stroke-width: 2.5; }
.group { display: flex; align-items: baseline; gap: var(--s2); padding: 0 2px; font-size: var(--t-sm); }
.group > h2, .group > h3 { font-size: var(--t-sm); letter-spacing: .02em; }

/* States: a shape and a word, the color third. */
.badge { display: inline-flex; align-items: center; gap: 4px; flex: none; max-width: 100%; min-height: 22px; padding: 0 8px; border-radius: var(--r-sm); background: var(--sunken); color: var(--text-2); font-size: var(--t-xs); font-weight: 500; line-height: 1.4; white-space: nowrap; }
.badge > .i { width: 13px; height: 13px; stroke-width: 2; }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.accent { background: var(--accent-soft); color: var(--accent-text); }
.badge.aide { background: var(--aide); color: var(--aide-ink); box-shadow: inset 0 0 0 1px var(--aide-line); }
.badge.line { background: transparent; color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line); }
.badge.dash { background: transparent; color: var(--text-2); border: 1px dashed var(--control); }
.badge.run > .i { animation: spin 2.4s linear infinite; }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-full); background: var(--pressed); color: var(--text-2); font-size: var(--t-xs); font-weight: 600; }
.count.warn { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-line); }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-full); background: var(--surface); color: var(--text-2); font-size: var(--t-xs); text-decoration: none; }
button.chip:hover, a.chip:hover { border-color: var(--control); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); font-weight: 600; }
.chip > .i { width: 14px; height: 14px; color: var(--muted); }
.chip .x { position: relative; display: inline-flex; border: 0; background: none; padding: 2px; margin-right: -6px; color: var(--muted); border-radius: 50%; }
.chip .x::after { content: ""; position: absolute; inset: -13px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--wg-c, var(--wg)); }
.dot.work { --wg-c: var(--wg-work); } .dot.home { --wg-c: var(--wg-home); } .dot.all { --wg-c: var(--accent); }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: var(--t-sm); font-weight: 600; background: light-dark(hsl(var(--h) 34% 88%), hsl(var(--h) 24% 25%)); color: light-dark(hsl(var(--h) 52% 24%), hsl(var(--h) 48% 84%)); }
.avatar.org { border-radius: var(--r); }
.avatar.xl { width: 64px; height: 64px; font-size: 1.5rem; }
.face { flex: none; display: block; border-radius: 22%; }
.meter { height: 6px; border-radius: 3px; background: var(--pressed); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--bar, var(--accent)); }
.callout { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: var(--r); background: var(--info-soft); color: var(--info); font-size: var(--t-sm); }
.callout > .i { margin-top: 2px; width: 17px; height: 17px; }
.callout.warn { background: var(--warn-soft); color: var(--warn); }
.callout.danger { background: var(--danger-soft); color: var(--danger); }
.callout.ok { background: var(--ok-soft); color: var(--ok); }
.empty { display: flex; align-items: center; gap: 10px; padding: var(--s3) var(--s4) var(--s4); color: var(--muted); font-size: var(--t-sm); }
.sk { border-radius: var(--r-sm); background: linear-gradient(90deg, var(--pressed) 25%, var(--sunken) 50%, var(--pressed) 75%) 0 0 / 300% 100%; animation: sk 1.6s linear infinite; }
@keyframes sk { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px var(--s4); font-size: var(--t-sm); }
.kv > dt { min-width: 72px; color: var(--muted); }
.kv > dd { min-width: 0; }
.prose { line-height: var(--lh-prose); font-size: var(--t-md); max-width: var(--measure); letter-spacing: .01em; }
.prose > * + * { margin-top: .7em; }
.prose ul { padding-left: 1.2em; list-style: disc; }
.prose li + li { margin-top: .25em; }
.prose li::marker { color: var(--muted); }
.prose code { font-family: var(--mono); font-size: .88em; padding: .1em .35em; border-radius: 4px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line-soft); }
pre.code { overflow-x: auto; padding: var(--s3); border-radius: var(--r); background: var(--sunken); border: 1px solid var(--line-soft); font: var(--t-xs)/1.7 var(--mono); overflow-wrap: normal; }
.add { display: block; background: var(--ok-soft); color: var(--ok); } .del { display: block; background: var(--danger-soft); color: var(--danger); }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.tbl :is(th, td) { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
.tbl th { color: var(--muted); font-weight: 500; }

/* Over everything: a dialog, a sheet from the side, a short note. */
dialog { color: inherit; border: 0; padding: 0; }
dialog::backdrop { background: var(--shade); }
dialog.modal { width: min(440px, calc(100% - 32px)); padding: var(--s5); border-radius: calc(var(--r-lg) + 2px); background: var(--raised); box-shadow: var(--shadow-3); border: 1px solid var(--line); }
dialog.side { margin: 0 0 0 auto; width: min(480px, 100%); height: 100%; max-height: none; background: var(--raised); box-shadow: var(--shadow-3); border-left: 1px solid var(--line); }
dialog[open] { animation: in var(--slow); }
@keyframes in { from { opacity: 0; translate: 0 8px; } }
.pop { position: absolute; z-index: 30; width: 328px; max-width: calc(100vw - 24px); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--raised); box-shadow: var(--shadow-3); }
#toast { position: absolute; z-index: 60; left: 50%; translate: -50% 0; bottom: 24px; width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: var(--s2); padding: 10px 16px; border-radius: var(--r); background: light-dark(#1B1F2C, #ECE7DC); color: light-dark(#F7F4EC, #171A25); font-size: var(--t-sm); box-shadow: var(--shadow-3); }
#toast .i { color: light-dark(#86CF9B, #23703C); }
@media (pointer: coarse) {
  .btn.sm, .btn.icon, .seg, .chip:is(button, a), .check { min-height: var(--hit); }
  .btn.icon, .btn.icon.sm { width: var(--hit); }
}
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* Conversation to the left, the pages to the right, each scrolling by itself. */
.app { position: relative; height: 100%; container: app / inline-size; overflow: hidden; background: var(--bg); }
.shell { height: 100%; display: grid; grid-template: minmax(0, 1fr) / var(--chat, clamp(360px, 31%, 480px)) minmax(0, 1fr); }
.m-only { display: none !important; }

.chat { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--chat-bg); border-right: 1px solid var(--line); }
.edge { position: absolute; z-index: 3; top: 0; bottom: 0; right: -5px; width: 10px; cursor: col-resize; }
.edge:hover::after, .edge:focus-visible::after { content: ""; position: absolute; inset: 0 4px; background: var(--accent); }
.talk { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s4) var(--s5) var(--s5); display: flex; flex-direction: column; gap: var(--s5); overscroll-behavior: contain; }
.talk > * { flex-shrink: 0; }
.day { display: flex; align-items: center; gap: var(--s3); font-size: var(--t-xs); color: var(--muted); }
.day::before, .day::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
/* The owner's words are put in a bubble; the secretary's read as a page. */
.me { align-self: flex-end; max-width: 88%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.me > .say { padding: 9px 14px; border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg); background: var(--accent-soft); color: var(--text); font-size: var(--t-md); line-height: 1.7; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: var(--t-xs); color: var(--muted); }
.meta .i { width: 13px; height: 13px; }
.her { display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: var(--s3); row-gap: var(--s2); }
.her > .face { margin-top: 1px; }
.her > .body { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.her .who { display: flex; align-items: baseline; gap: var(--s2); font-size: var(--t-xs); color: var(--muted); }
.her .who b { font-size: var(--t-sm); color: var(--text); font-weight: 600; }
.linkcard { display: grid; grid-template-columns: 1fr 88px; text-decoration: none; color: inherit; overflow: hidden; }
.linkcard > div { padding: 10px 14px; min-width: 0; }
.linkcard:hover { border-color: var(--control); }
.linkcard svg { width: 100%; height: 100%; display: block; }
.attach { width: 200px; max-width: 100%; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); padding: 0; background: none; }
.attach svg { display: block; width: 100%; }
.thinking { display: flex; align-items: center; gap: 10px; font-size: var(--t-sm); color: var(--muted); }
.pulse { display: inline-flex; gap: 4px; } .pulse i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: pulse 1.4s infinite; } .pulse i:nth-child(2) { animation-delay: .2s; } .pulse i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

/* A request: the secretary's paper, with what is asked at the top. */
.ask { background: var(--aide); border: 1px solid var(--aide-line); border-radius: var(--r-lg); box-shadow: var(--shadow-2); overflow: hidden; min-width: 0; }
.ask > header { display: flex; align-items: center; gap: var(--s2); padding: 10px 14px; border-bottom: 1px solid var(--aide-line); font-size: var(--t-xs); color: var(--aide-ink); }
.ask > header .i { width: 15px; height: 15px; }
.ask > .in { padding: 14px; display: flex; flex-direction: column; gap: var(--s3); }
.ask h3 { font-size: var(--t-md); }
.ask .kv { padding: var(--s3); border-radius: var(--r); background: var(--surface); border: 1px solid var(--aide-line); }
.ask > footer { display: flex; flex-wrap: wrap; gap: var(--s2); padding: 0 14px 14px; }
.ask.done { background: var(--sunken); border-color: var(--line); box-shadow: none; }
.ask.done > header { border: 0; color: var(--muted); }
details > summary { display: flex; align-items: center; gap: 6px; min-height: 28px; cursor: pointer; font-size: var(--t-xs); color: var(--muted); list-style: none; border-radius: var(--r-sm); }
details > summary::-webkit-details-marker { display: none; }
details > summary .i { width: 14px; height: 14px; transition: rotate var(--fast); }
details[open] > summary .i { rotate: 90deg; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 10px 12px; text-align: left; border: 1px solid var(--aide-line); border-radius: var(--r); background: var(--surface); font-size: var(--t-sm); cursor: pointer; }
.opt:hover { border-color: var(--control); }
.opt:has(:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt > input { margin: 3px 0 0; accent-color: var(--accent); flex: none; width: 16px; height: 16px; }
.opt b { display: block; font-weight: 600; } .opt small { color: var(--muted); font-size: var(--t-xs); }
.opt:has(:checked) small { color: var(--text-2); }

.composer { flex: none; margin: 0 var(--s4) var(--s4); padding: 10px; border: 1px solid var(--control); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-2); display: flex; flex-direction: column; gap: var(--s2); }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-2); }
.composer .ctx { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--t-xs); color: var(--muted); padding: 0 4px; }
.composer textarea { border: 0; background: none; resize: none; padding: 2px 4px; width: 100%; min-height: 28px; max-height: 160px; field-sizing: content; font-size: var(--t-md); line-height: 1.7; }
.composer textarea:focus-visible { outline: none; }
.composer textarea::placeholder { color: var(--muted); opacity: 1; }

.main { container: frame / inline-size; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { flex: none; display: flex; align-items: center; gap: var(--s3); height: 56px; padding: 0 var(--s4) 0 var(--s5); background: var(--surface); position: relative; z-index: 5; }
.bar .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar .name b { font-family: var(--heading); font-weight: var(--heading-weight); font-size: var(--t-lg); line-height: 1.2; }
.bar .name small { display: block; font-size: var(--t-xs); color: var(--muted); line-height: 1.3; white-space: nowrap; }
.wgs { display: flex; align-items: center; gap: 2px; margin-left: var(--s2); }
.wgs button, .wgs a.add-wg { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 11px; border: 1px solid transparent; border-radius: var(--r-full); background: transparent; font-size: var(--t-sm); color: var(--text-2); }
.wgs button:hover { background: var(--hover); }
.wgs button[aria-pressed="true"] { border-color: color-mix(in srgb, var(--wg) 45%, transparent); background: color-mix(in srgb, var(--wg) 9%, transparent); color: var(--text); font-weight: 600; }
.wg-hint { font-size: var(--t-xs); color: var(--muted); }
.alive { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 10px; border: 0; border-radius: var(--r-full); background: none; font-size: var(--t-sm); color: var(--text-2); white-space: nowrap; }
.alive:hover { background: var(--hover); color: var(--text); }
.alive .dot { --wg-c: var(--info); box-shadow: 0 0 0 3px var(--info-soft); }
.tabs { flex: none; display: flex; gap: 0; padding: 0 var(--s3); background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; font-size: var(--t-base); color: var(--muted); text-decoration: none; white-space: nowrap; }
.tab > .i { width: 17px; height: 17px; }
.tab:hover { color: var(--text); }
.tab[aria-current="page"] { color: var(--text); font-weight: 600; }
.tab[aria-current="page"] > .i { color: var(--wg); }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--wg); }
.tab:focus-visible { outline-offset: -3px; border-radius: var(--r); }
.gap { flex: 1; }
.pane { flex: 1; min-height: 0; overflow: hidden; container: main / inline-size; position: relative; display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s5) var(--s5) 48px; display: flex; flex-direction: column; gap: var(--s4); }
.page > * { flex-shrink: 0; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); min-height: 36px; }
.head .n { color: var(--muted); font-size: var(--t-sm); }
.head .end { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.lede { color: var(--muted); font-size: var(--t-sm); max-width: 48em; margin-top: -8px; }
.filters { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }

/* A list and what is picked of it. */
.split { flex: 1; min-height: 0; display: flex; }
.split > .page { flex: 1 1 0; min-width: 0; }
.split.open > .page { flex: 0 0 44%; padding-inline: var(--s4); }
.split > .detail { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); }
.dbar { flex: none; display: flex; align-items: center; gap: var(--s1); min-height: 48px; padding: 0 var(--s3) 0 var(--s5); border-bottom: 1px solid var(--line-soft); }
.dscroll { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
.dscroll > * { flex-shrink: 0; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec > h3 { font-size: var(--t-sm); color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.log { display: flex; flex-direction: column; }
.log > li { position: relative; display: grid; grid-template-columns: 84px 1fr; gap: var(--s3); padding: 6px 0; font-size: var(--t-sm); }
.log time { color: var(--muted); font-size: var(--t-xs); padding-top: 2px; }
.back { display: none; }
.sidenav { flex: none; width: 208px; overflow-y: auto; padding: var(--s4) var(--s2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; }
.sidenav .h { padding: var(--s3) 10px 4px; font-size: var(--t-xs); color: var(--muted); }
.nav { display: flex; align-items: center; gap: 9px; min-height: 36px; padding: 0 10px; border: 0; border-radius: var(--r); background: none; color: var(--text-2); font-size: var(--t-sm); text-decoration: none; text-align: left; }
.nav > .i { width: 17px; height: 17px; color: var(--muted); }
.nav:hover { background: var(--pressed); color: var(--text); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav[aria-current="page"] .i { color: inherit; }
.nav .xs { margin-left: auto; color: var(--muted); font-weight: 400; }
.nav[aria-current="page"] .xs { color: inherit; }

/* Home. */
.brief { background: var(--aide); border: 1px solid var(--aide-line); border-radius: var(--r-lg); padding: var(--s4) calc(var(--s4) + 2px); display: flex; gap: var(--s4); }
.brief p { font-size: var(--t-md); line-height: var(--lh-prose); max-width: 44em; }
.brief .facts { display: flex; flex-wrap: wrap; gap: 4px var(--s4); margin-top: var(--s2); font-size: var(--t-sm); color: var(--aide-ink); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); align-items: start; }
.tiles > .col { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.ev { display: grid; grid-template-columns: 46px 3px minmax(0, 1fr) auto; column-gap: 10px; align-items: stretch; padding: 8px var(--s4); }
.ev > time { font-size: var(--t-sm); line-height: 1.5; text-align: right; } .ev > time small { display: block; font-size: var(--t-xs); color: var(--muted); }
.ev > .rule { border-radius: 2px; background: var(--wg-c); }
.ev > .rule.work { --wg-c: var(--wg-work); } .ev > .rule.home { --wg-c: var(--wg-home); }
.ev.past { color: var(--muted); } .ev.now { background: var(--accent-soft); } .ev.now .xs { color: var(--text-2); }
.ev > .btn { align-self: center; }
.mini { padding: 8px var(--s4); display: flex; flex-direction: column; gap: 5px; position: relative; }
.mini + .mini { border-top: 1px solid var(--line-soft); }
.prog { display: grid; grid-template-columns: minmax(40px, 96px) auto minmax(0, 1fr); gap: var(--s2); align-items: center; font-size: var(--t-xs); color: var(--muted); }
.sumrow { display: flex; flex-wrap: wrap; gap: 6px; }

/* Calendar. */
.cal { display: grid; grid-template-columns: 48px repeat(7, minmax(0, 1fr)); flex: 1 0 auto; overflow: hidden; }
.cal .dh { padding: 8px 4px 6px; text-align: center; border-left: 1px solid var(--line-soft); border-bottom: 1px solid var(--line); font-size: var(--t-xs); color: var(--muted); }
.cal .dh b { display: block; font-size: var(--t-lg); font-weight: 500; color: var(--text); line-height: 1.5; }
.cal .dh.today b { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 600; margin: -2px; }
.cal .allday { grid-column: span 1; min-height: 30px; padding: 3px; border-left: 1px solid var(--line-soft); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.cal .hours { position: relative; height: 560px; }
.cal .hours span { position: absolute; right: 8px; translate: 0 -50%; white-space: nowrap; font-size: var(--t-xs); color: var(--muted); }
.cal .col { position: relative; height: 560px; border-left: 1px solid var(--line-soft); background: repeating-linear-gradient(to bottom, transparent 0 55px, var(--line-soft) 55px 56px); }
.cev { display: flex; flex-direction: column; justify-content: flex-start; position: absolute; left: 3px; right: 3px; overflow: hidden; padding: 3px 6px; border-radius: var(--r-sm); border: 0; text-align: left; font-size: var(--t-xs); line-height: 1.4; color: var(--text); background: color-mix(in srgb, var(--wg-c) 16%, var(--surface)); }
.cev.work { --wg-c: var(--wg-work); } .cev.home { --wg-c: var(--wg-home); }
.cev b { font-weight: 600; max-width: 100%; }
.cev.flat { position: static; }
.cev.hold { background: transparent; border: 1.5px dashed var(--control); }
.cev.faint { background: repeating-linear-gradient(135deg, var(--pressed) 0 4px, var(--sunken) 4px 8px); color: var(--muted); }
.nowline { position: absolute; left: -4px; right: 0; border-top: 2px solid var(--danger); z-index: 2; } .nowline::before { content: ""; position: absolute; left: 0; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.legend { display: flex; flex-wrap: wrap; gap: 4px var(--s4); font-size: var(--t-xs); color: var(--text-2); } .legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

/* Things, with their pictures. */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(196px, 100%), 1fr)); gap: var(--s3); }
.thing { position: relative; display: flex; flex-direction: column; overflow: hidden; transition: border-color var(--fast), box-shadow var(--fast); }
.thing:hover { border-color: var(--control); box-shadow: var(--shadow-2); }
.thing > .pic { aspect-ratio: 4 / 3; background: light-dark(#F3F1EC, #20232D); display: flex; align-items: center; justify-content: center; color: light-dark(#4A5068, #B9BBC6); border-bottom: 1px solid var(--line-soft); }
.thing > .pic svg { width: 62%; height: 72%; }
.thing > .b { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.thing .t { font-weight: 500; line-height: 1.45; }
.thing .foot { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.thumb { flex: none; width: 48px; height: 48px; border-radius: var(--r-sm); background: light-dark(#F3F1EC, #20232D); display: flex; align-items: center; justify-content: center; color: light-dark(#4A5068, #B9BBC6); } .thumb svg { width: 34px; height: 34px; }

.bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; height: 120px; align-items: end; border-bottom: 1px solid var(--line); }
.bars button { display: flex; flex-direction: column-reverse; gap: 2px; justify-content: flex-start; height: 100%; padding: 0; border: 0; background: none; border-radius: 4px 4px 0 0; } .bars button:hover, .bars .on { background: var(--sunken); }
.bars i { display: block; background: var(--c); border-radius: 2px; margin: 0 auto; width: min(22px, 80%); }
.axis { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; font-size: var(--t-xs); color: var(--muted); text-align: center; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--s2); }
.swatch { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: var(--t-xs); } .swatch i { display: block; height: 44px; } .swatch span { display: block; padding: 5px 8px; background: var(--surface); }

/* A phone: one column, what is often used within the thumb's reach. */
@container app (max-width: 700px) {
  .m-only { display: flex !important; }
  .d-only { display: none !important; }
  .m-head { align-items: center; gap: var(--s2); min-height: 56px; padding: var(--s1) var(--s3) var(--s1) var(--s4); background: var(--surface); border-bottom: 1px solid var(--line); }
  .m-head h1 { font-size: 1.25rem; flex: 1; min-width: 0; }
  .m-head .back { display: inline-flex; margin-left: -12px; }
  .m-wg { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-full); background: var(--surface); font-size: var(--t-sm); }
  .bar, .tabs { display: none; }
  .page { padding: var(--s4) var(--s4) var(--s5); }
  .page .head > h1 { display: none; }
  .head { min-height: 0; } .head .end { margin-left: 0; } .head .n { flex: 1; }
  .page .head:not(:has(> :not(h1, .d-only))) { display: none; }
  .lede { margin-top: 0; }
  .main:has(.split.open) > .m-head { display: none !important; }
  .sidenav.index .nav[aria-current] { background: none; color: var(--text-2); font-weight: 400; } .sidenav.index .nav[aria-current] .i { color: var(--muted); }
  .sidenav.index .nav { border-radius: 0; border-bottom: 1px solid var(--line); }
  .item.wraps { flex-wrap: wrap; } .item.wraps > .main { flex: 1 1 60%; }
  .item.wraps > .badge { margin-left: 48px; }
  .sumcard { flex-wrap: wrap; } .sumcard > .wrap { order: 3; flex: 1 0 100%; } .sumcard > b { flex: 1; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .thing > .b { padding: 8px 10px 10px; }
  .brief { padding: 14px; gap: var(--s3); }
  .sidenav.index { display: flex; width: auto; flex: 1; border: 0; padding: var(--s3) var(--s3); }
  .sidenav.index .nav { min-height: 48px; font-size: var(--t-base); }
  .page-with-index { display: none !important; }

  .chat { grid-row: 2; grid-column: 1; border: 0; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px light-dark(rgb(16 20 36 / .06), rgb(0 0 0 / .35)); }
  .talk, .edge { display: none; }
  .peek { position: relative; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px var(--s4) 2px; border: 0; background: none; text-align: left; font-size: var(--t-sm); color: var(--text-2); }
  .peek::before { content: ""; position: absolute; top: 4px; left: 50%; width: 32px; height: 3px; margin-left: -16px; border-radius: 2px; background: var(--line); }
  .composer { margin: 4px var(--s3) 8px; padding: 4px 4px 4px 6px; flex-direction: row; align-items: center; gap: 2px; flex-wrap: wrap; box-shadow: none; }
  .composer .ctx { display: none; }
  .composer textarea { order: 2; min-height: 44px; padding-block: 8px; flex: 1; width: auto; min-width: 0; font-size: 1rem; }
  .composer .tools { display: contents; }
  .composer .tools .clip { order: 1; } .composer .tools .send { order: 3; }
  .composer .tools .gap, .composer .tools .kbd { display: none; }
  .composer .btn { min-height: 44px; width: 44px; padding: 0; } .composer .send span { display: none; }
  .acts { align-items: center; gap: var(--s2); padding: 6px var(--s3); border-top: 1px solid var(--line); background: var(--surface); overflow-x: auto; scrollbar-width: none; }
  .tabbar { grid-row: 3; grid-column: 1; justify-content: space-around; padding: 0 var(--s1) env(safe-area-inset-bottom); border-top: 1px solid var(--line-soft); background: var(--surface); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 52px; font-size: .6875rem; color: var(--muted); text-decoration: none; }
  .tabbar a .i { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--accent-text); font-weight: 600; }
  .shell { grid-template: minmax(0, 1fr) auto auto / minmax(0, 1fr); }
  .main { grid-row: 1; grid-column: 1; }
  .chat-open .chat { grid-row: 1 / 3; grid-column: 1; z-index: 8; background: var(--chat-bg); border: 0; box-shadow: none; }
  .chat-open .talk { display: flex; padding: var(--s4); }
  .chat-open .peek { display: none !important; }
  .split.open > .page { display: none; }
  .split > .detail { border-left: 0; }
  .dbar { padding: 0 var(--s2); } .dbar .back { display: inline-flex; } .dbar .close { display: none; }
  .dscroll { padding: var(--s4); }
  .cal { grid-template-columns: 40px repeat(var(--days, 3), minmax(0, 1fr)); }
  .cal .d3 { display: none; }
  .btn, .btn.sm, .btn.icon, .seg, .alive, .input, .select > select, .chip:is(button, a), .check, .nav, .opt, details > summary { min-height: 44px; }
  .btn.icon, .btn.icon.sm, .seg.only { width: 44px; }
  .seg { min-width: 44px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--s4) * -1); padding: 3px var(--s4); }
  .filters .search { flex: 0 0 180px; } .filters .search:only-child { flex: 1; } .filters > * { flex: none; }
  .filters :is(.input, select) { min-height: 44px; }
  .input { font-size: 1rem; }
  .sumrow { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--s4) * -1); padding: 2px var(--s4); } .sumrow > * { flex: none; }
  .ask > footer .btn { flex: 1 1 auto; min-height: 44px; }
  .axis span:nth-child(even) { visibility: hidden; }
}
@container main (max-width: 720px) {
  .page { padding-inline: var(--s4); }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .split.open > .page { display: none; }
  .dbar .back { display: inline-flex; }
}
@container main (max-width: 600px) {
  .split:has(> .sidenav:not(.index)) { flex-direction: column; }
  .sidenav:not(.index) { width: auto; flex-direction: row; padding: 6px var(--s3); overflow: auto hidden; scrollbar-width: none; border-right: 0; border-bottom: 1px solid var(--line); background: var(--surface); }
  .sidenav:not(.index) .h { display: none; }
  .sidenav:not(.index) .nav { flex: none; white-space: nowrap; }
}
@container app (min-width: 701px) {
  @container main (max-width: 600px) {
    .split:has(> .sidenav.index) { flex-direction: column; }
    .sidenav.index { width: auto; flex-direction: row; padding: 6px var(--s3); overflow: auto hidden; border-right: 0; border-bottom: 1px solid var(--line); background: var(--surface); }
    .sidenav.index .h { display: none; } .sidenav.index .nav { flex: none; white-space: nowrap; }
  }
}
@container frame (max-width: 720px) {
  .bar { gap: var(--s2); padding: 0 var(--s3); }
  .bar .name > div, #theme, .bar .alive > .dot, .wg-hint { display: none; }
  .wgs { margin: 0; min-width: 0; overflow-x: auto; scrollbar-width: none; } .wgs > * { flex: none; }
}
@container app (max-width: 1180px) { .wg-hint, .kbd { display: none; } }

/* Shows the phone's layout on a wide screen. */
:root[data-frame="phone"] body { display: grid; place-items: center; background: var(--pressed); }
:root[data-frame="phone"] .app { width: 390px; height: min(844px, calc(100% - 24px)); border-radius: 28px; border: 1px solid var(--line); box-shadow: var(--shadow-3); }
/* Threads: a head that says which, what is said, and where the next words go. */
.conv { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chead { flex: none; display: flex; align-items: center; gap: var(--s2); min-height: 56px; padding: 6px var(--s3) 6px var(--s4); border-bottom: 1px solid var(--line); background: var(--surface); }
.chead > .grow > b { display: block; font-size: var(--t-base); font-weight: 600; line-height: 1.4; }
.chead > .btn { flex: none; }
.back-list { padding: 0 6px; gap: 4px; margin-left: -8px; }
.about > summary { min-height: 22px; gap: 8px; }
.about[open] > .kv { position: absolute; z-index: 6; left: 12px; right: 12px; margin-top: 6px; padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--raised); box-shadow: var(--shadow-3); }
.tlist { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.tlist > * { flex-shrink: 0; }
.th .row { gap: var(--s2); }
.th.unread .t { font-weight: 700; }
.th.unread [data-last] { color: var(--text-2); }
.count.new { background: var(--accent); color: var(--on-accent); }
.item.th .sub:empty { display: none; }
.fresh { display: flex; align-items: center; gap: var(--s3); font-size: var(--t-xs); font-weight: 600; color: var(--accent-text); }
.fresh::before, .fresh::after { content: ""; flex: 1; border-top: 1px solid var(--accent-line); }
.result > header { display: flex; align-items: center; gap: var(--s2); padding: 10px 14px; border-bottom: 1px solid var(--line-soft); color: var(--ok); font-size: var(--t-xs); }
.result > header:has([href="#i-alert-triangle"]) { color: var(--danger); }
.result > .in { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: var(--s2); }
.who > .gap { flex: 1; }
.quote-it { min-height: 26px; align-self: center; opacity: .75; }
.newtalk { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: var(--s3); text-align: center; }
.newtalk .list { width: 100%; text-align: left; }
.dest { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.dest .segs { flex: none; padding: 2px; }
.dest .seg { min-height: 28px; padding: 0 10px; font-size: var(--t-xs); }
.dest-name { font-size: var(--t-sm); font-weight: 500; }
.dest-chip { flex: 0 1 auto; min-width: 0; background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); font-weight: 600; }
.arrival { flex: none; display: flex; align-items: center; gap: 10px; margin: 0 var(--s4) var(--s2); padding: 8px 8px 8px 12px; border: 1px solid var(--ok-line); border-radius: var(--r); background: var(--ok-soft); color: var(--ok); }
.arrival .grow { color: var(--text); }
.two { flex: 1; min-height: 0; display: grid; grid-template: minmax(0, 1fr) / 264px minmax(0, 1fr); }
.two > div { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.side-list { border-right: 1px solid var(--line); background: var(--bg); }
.side-list .tlist { padding: var(--s3); }
.side-list .th .sub { gap: 2px 6px; }
:root[data-conv="side"] .shell { grid-template-columns: var(--chat, clamp(580px, 46%, 780px)) minmax(0, 1fr); }
.talk.stream { gap: var(--s3); }
.talk { position: relative; }
.tcard { position: relative; }
.tcard.on { border-color: var(--accent); }
.tc-head { position: relative; display: flex; align-items: center; gap: var(--s2); padding: 10px 14px; }
.tc-body { padding: var(--s3) 14px 14px; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: var(--s4); }
.tc-foot { padding: 0 14px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: var(--s4); align-items: start; }
.tryframe { display: flex; flex-direction: column; gap: 6px; min-width: 0; margin: 0; }
.tryframe.wide { grid-column: 1 / -1; }
.tryframe > .fr { display: flex; flex-direction: column; height: 520px; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--chat-bg); }
.shell .tryframe .talk { display: flex; padding: var(--s4); }
/* Not room for three columns: the list gives way, as on a phone. */
@container app (max-width: 1160px) {
  :root[data-conv="side"] .shell { grid-template-columns: clamp(340px, 34%, 460px) minmax(0, 1fr); }
  .conv .two { grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
  .conv .two:not(.at-list) > .side-list, .conv .two.at-list > .side-talk { display: none; }
  .conv .two .back-list { display: inline-flex !important; }
}
@container app (max-width: 700px) {
  .shell:not(.chat-open) .conv, .shell:not(.chat-open) .arrival { display: none; }
  .chat-open .conv { display: flex; }
  .chead { padding-inline: var(--s2); }
  .peek { min-height: 48px; }
  .peek b { font-weight: 600; }
  .chat-open .composer .ctx { display: flex; flex: 0 0 100%; order: 0; padding: 2px 6px 0; }
  .composer .destbox { order: -1; flex: 0 0 100%; min-width: 0; padding: 2px 4px 0; }
  .dest .seg { min-height: 44px; }
  .shell:not(.chat-open) .composer .destbox { display: none; }
  .tryframe .two { grid-template-columns: minmax(0, 1fr); } .tryframe .two > .side-list { display: none; }
  :root[data-conv="side"] .shell { grid-template-columns: minmax(0, 1fr); }
}
</style>

}
let toastTimer;
function toast(t) {
  const el = $("#toast");
  el.innerHTML = `${i("circle-check")}<span>${esc(t)}</span>`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), 2600);
}
/** Redraw around the control that was used, which the redraw replaces. */
function redraw() {
  const el = document.activeElement;
  const same = el && el !== document.body && ["data-sel", "data-entry", "data-open", "data-what", "data-job", "data-k", "data-go", "data-key", "aria-label", "data-theme-pick", "data-choice", "data-wg-pick", "data-thread", "data-st", "data-layer", "data-v", "data-act"].flatMap((a) => (el.hasAttribute(a) ? [`[${a}="${CSS.escape(el.getAttribute(a))}"]`] : [])).join("");
  const box = same && ["#try", "#theme", "#wgs", "#pane", "#conv"].find((b) => el.closest(b));
  draw(true);
  if (box) (($(`${box} ${same}`) ?? $("#pane .detail .btn"))?.focus({ preventScroll: true }));
}
const go = (h) => { chatOpen = false; if (location.hash === `#${h}`) redraw(); else location.hash = h; };

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-sel],[data-entry],[data-open],[data-theme-pick],[data-choice],[data-wg-pick],[data-thread]");
  if (!t) { if (e.target.closest("#tabbar a") && chatOpen) { chatOpen = false; draw(true); } return; }
  const d = t.dataset;
  if (d.themePick) { store.set("theme", d.themePick); applyTheme(d.themePick); return redraw(); }
  if (d.choice) { const [k, v] = d.choice.split(":"); root.dataset[k] = v; store.set(k, v); if (k === "conv") $("#shell").style.gridTemplateColumns = ""; return redraw(); }
  if (d.wgPick) { wg = d.wgPick; $("#wgsheet").close(); for (const k of ["tasks", "delegated", "parties", "things", "contracts", "entry", "st", "thingscat", "contractscat"]) delete sel[k]; if (conv.view === "thread" && !inWg(thread(conv.id))) return goConv("list"); return redraw(); }
  if (d.open) { e.preventDefault(); const [k, id] = d.open.split(":"); if (k === "memory") { sel.layer = Object.keys(ENTRIES).find((x) => ENTRIES[x].some((m) => m.id === id)); sel.entry = id; } else sel[k] = id; chatOpen = false; return go(k); }
  if (d.sel) { const at = d.sel.indexOf(":"); sel[d.sel.slice(0, at)] = d.sel.slice(at + 1); return redraw(); }
  if (d.thread) return goConv("thread", d.thread);
  if (d.entry) { sel.entry = d.entry; return redraw(); }
  const act = {
    todo: () => { e.preventDefault(); toast("PoC なので、この先は作っていない"); },
    toast: () => toast("保存した"),
    go: () => go(d.go),
    opentalk: () => { chatOpen = true; goConv("thread", d.id); },
    openjob: () => { sel.delegated = d.job; chatOpen = false; go("delegated"); },
    answerjob: () => { sel.delegated = d.job; redraw(); },
    check: () => { const on = t.getAttribute("aria-pressed") !== "true"; t.setAttribute("aria-pressed", on); ticked[on ? "add" : "delete"](d.what); toast(on ? "済にした" : "戻した"); },
    press: () => $$("[data-act=press]", t.parentElement).forEach((b) => b.setAttribute("aria-pressed", b === t)),
    st: () => { sel.st = d.st; redraw(); },
    hv: () => { sel[`${d.k}v`] = d.v; redraw(); },
    cat: () => { sel[`${d.k}cat`] = d.v; redraw(); },
    layer: () => { sel.layer = d.layer || undefined; delete sel.entry; draw(); },
    close: () => { delete sel[d.key]; draw(true); },
    attach: () => { if (!attached.includes(d.what)) attached.push(d.what); redraw(); toast("会話に添えた"); },
    file: () => { attached.push("見積もり.pdf"); redraw(); },
    detach: () => { attached.splice(Number(d.n), 1); draw(true); $("#say").focus(); },
    answer: () => { const card = t.closest("[data-ask]"); const k = card.dataset.ask; const said = d.a === "reply" ? `「${$("input.input", card).value.trim() || $("input:checked + span b", card).textContent.replace("（おすすめ）", "")}」と答えた` : d.a; const at = t.closest("#pane") ? "#pane" : "#conv"; answered[k] = said; draw(true); $(`${at} [data-done="${k}"]`)?.focus({ preventScroll: true }); toast(said); },
    remove: () => $("#modal").showModal(),
    status: () => $("#status").showModal(),
    wgsheet: () => $("#wgsheet").showModal(),
    image: () => { $("#imagebox").innerHTML = t.innerHTML; $("#image").showModal(); },
    shut: () => t.closest("dialog").close(),
    try: () => { $("#try").hidden = !$("#try").hidden; },
    frame: () => { if (root.dataset.frame) delete root.dataset.frame; else root.dataset.frame = "phone"; $("#shell").style.gridTemplateColumns = ""; chatOpen = false; draw(true); },
    unfold: () => { chatOpen = true; first = true; draw(true, true); $("#say").focus({ preventScroll: true }); },
    fold: () => { chatOpen = false; draw(true); },
  }[d.act];
  (act ?? (THREAD_ACTS[d.act] && (() => THREAD_ACTS[d.act](d, t))))?.();
});
for (const id of ["modal", "status", "wgsheet", "image"]) document.addEventListener("click", (e) => { if (e.target.id !== id) return; const r = e.target.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) e.target.close(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#try") && !$("#try").hidden) $("#try").hidden = true;
  if (e.target.id === "say" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#composer").requestSubmit();
  if (e.target.id === "edge" && ["ArrowLeft", "ArrowRight"].includes(e.key)) setChat($("#chat").offsetWidth + (e.key === "ArrowLeft" ? -24 : 24));
  const radios = e.target.closest?.('[role="radiogroup"]');
  if (radios && e.target.matches('[role="radio"]') && ["ArrowLeft", "ArrowRight"].includes(e.key)) { const rs = $$('[role="radio"]', radios); const next = rs[(rs.indexOf(e.target) + (e.key === "ArrowRight" ? 1 : rs.length - 1)) % rs.length]; next.focus(); next.click(); }
});
/** Whether the phone's layout is drawn, as on a phone or in its frame. */
const narrow = () => $("#app").clientWidth <= 700;
const setChat = (w) => { const all = $("#app").clientWidth; const least = convKind() === "side" && all > 1160 ? 560 : 320; $("#shell").style.gridTemplateColumns = narrow() ? "" : `${Math.max(least, Math.min(all - 420, 860, w))}px minmax(0, 1fr)`; };
document.addEventListener("pointerdown", (e) => { if (e.target.id !== "edge") return; e.target.setPointerCapture(e.pointerId); const move = (m) => setChat(m.clientX); e.target.addEventListener("pointermove", move); e.target.addEventListener("pointerup", () => e.target.removeEventListener("pointermove", move), { once: true }); });
document.addEventListener("submit", (e) => { e.preventDefault(); const v = $("#say").value.trim(); if (!v) return; $("#say").value = ""; attached = []; sendSaid(v); delete drafts.new; delete drafts[conv.id]; draw(true, true); });
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el.closest("#pane, #conv")) return;
  const others = el.type === "radio" ? $$(`input[name="${el.name}"]`) : [el];
  for (const o of others) typed.set(fieldKey(o), toggles(o) ? o.checked : o.value);
  if (el.matches("[data-search]")) showMatches(el);
});
addEventListener("hashchange", () => { chatOpen = route() === "chat"; draw(false, chatOpen); });
addEventListener("resize", () => { if (narrow()) $("#shell").style.gridTemplateColumns = ""; });
addEventListener("storage", (e) => { if (e.key === "famulen-theme") { applyTheme(e.newValue ?? "system"); draw(true); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(themeNow()));
for (const k of Object.keys(DEFAULT)) { const v = store.get(k); if (v) root.dataset[k] = v; }
shell();
chatOpen = route() === "chat";
draw();
applyTheme(themeNow());
</script>
