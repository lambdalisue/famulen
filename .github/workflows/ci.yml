name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request only needs its latest commit checked. A run on main waits
# for the one before it instead of cancelling it, so each one finishes and
# saves the caches that pull requests start from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Nothing here runs a debugger, and a panic names its place without debug
  # information: the tests compile faster and the caches are smaller.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The store the development shell comes from, and what Nix unpacked of
      # the inputs it is evaluated from. Only an exact match is restored, and
      # only main saves, so pull requests cannot evict the caches each other
      # start from.
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          paths: ~/.cache/nix
          save: ${{ github.ref == 'refs/heads/main' }}
      # Load the development shell (flake.nix) into the job, so the steps
      # below run the same commands as local development.
      - uses: nicknovitski/nix-develop@v1.2.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Without the job's name in the key, the e2e job starts from this
          # cache too.
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same gate as local development (justfile).
      - run: just ci
        env:
          CI: "1"

  # The console driven in a browser against a fresh backend. Browsers are
  # installed per run, so this stays on one OS.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          paths: ~/.cache/nix
          save: false
      - uses: nicknovitski/nix-develop@v1.2.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: workspace
          save-if: false
      - run: just e2e
        env:
          CI: "1"

  # The package `nix profile install github:lambdalisue/famulen` installs,
  # built on each system the flake lists from the archive GitHub serves — the
  # source such an install fetches, and the only one with VERSION filled in.
  # Only on main: macOS runners are few, and a pull request needs its one for
  # the gate.
  nix:
    if: github.event_name == 'push'
    uses: lambdalisue/nix-github-release/.github/workflows/build.yml@v0.1.3
