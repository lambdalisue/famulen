name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request only needs its latest commit checked. A run on main waits
# for the one before it instead of cancelling it, so each one finishes and
# saves the caches that pull requests start from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Nothing here runs a debugger, and a panic names its place without debug
  # information: the tests compile faster and the caches are smaller.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # What a pull request has to be checked for. Only prose and the console are
  # told apart; whatever else it changes, and anything on main, is checked in
  # full.
  scope:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      os: ${{ steps.scope.outputs.os }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ github.event_name == 'pull_request' && format('repos/{0}/pulls/{1}/files', github.repository, github.event.number) || '' }}
        run: |
          code=true os='["ubuntu-latest","macos-latest"]'
          # A list that could not be read, or was cut off, leaves the full check.
          if [ -n "$FILES" ] \
            && files=$(gh api --paginate "$FILES?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)') \
            && [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 3000 ]; then
            # No test reads the prose.
            rest=$(grep -vE '^(docs/|[^/]+\.md$)' <<< "$files" || true)
            if [ -z "$rest" ]; then
              code=false
            # The console is built and driven on Linux; it has nothing the
            # Rust tests read.
            elif ! grep -qv '^frontend/' <<< "$rest"; then
              os='["ubuntu-latest"]'
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "os=$os" | tee -a "$GITHUB_OUTPUT"

  ci:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The store the development shell comes from. Only an exact match is
      # restored, and only main saves, so pull requests cannot evict the
      # caches each other start from. Nothing of the home directory goes with
      # it: it is unpacked as root, which would leave ~/.cache to root.
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          save: ${{ github.ref == 'refs/heads/main' }}
      # Load the development shell (flake.nix) into the job, so the steps
      # below run the same commands as local development.
      - uses: nicknovitski/nix-develop@v1.2.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Without the job's name in the key, the e2e job starts from this
          # cache too.
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same gate as local development (justfile).
      - run: just ${{ runner.os == 'macOS' && 'ci-macos' || 'ci' }}
        env:
          CI: "1"

  # The console driven in a browser against a fresh backend. Browsers are
  # installed per run, so this stays on one OS. The test files are split over
  # runners rather than run side by side on one: each has a backend and a
  # processor to itself, as locally.
  e2e:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          save: false
      - uses: nicknovitski/nix-develop@v1.2.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: workspace
          save-if: false
      - run: just e2e --shard=${{ matrix.shard }}
        env:
          CI: "1"
      # A test that fails only now and then cannot be seen again on demand,
      # so what the browser saw is kept from the run it failed in.
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-traces-${{ strategy.job-index }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The one check to require of a pull request: a job skipped because of the
  # scope is as good as a passed one, and nothing else is.
  passed:
    if: ${{ !cancelled() }}
    needs: [scope, ci, e2e]
    runs-on: ubuntu-slim
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .scope.result == "success"
            and ((if .scope.outputs.code == "true" then "success" else "skipped" end) as $due
              | .ci.result == $due and .e2e.result == $due)
          ' <<< "$RESULTS"

  # The package `nix profile install github:lambdalisue/famulen` installs,
  # built on each system the flake lists from the archive GitHub serves — the
  # source such an install fetches, and the only one with VERSION filled in.
  # Only on main: macOS runners are few, and a pull request needs its one for
  # the gate.
  nix:
    if: github.event_name == 'push'
    uses: lambdalisue/nix-github-release/.github/workflows/build.yml@v0.1.3
