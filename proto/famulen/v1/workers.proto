syntax = "proto3";

package famulen.v1;

import "famulen/v1/common.proto";
import "famulen/v1/console.proto";
import "famulen/v1/options.proto";
import "famulen/v1/records.proto";
import "famulen/v1/settings.proto";

message DelegateTaskRequest {
  string title = 1;
  // The whole request, as Markdown: the goal, what is already known, what to
  // leave alone, and how to check the work. The worker knows nothing but this
  // and, for code, the owner's standing steps to finish it (a review, a pull
  // request, a merge and the like; get_worker_settings), which are added by
  // themselves: do not write how to finish, unless the owner asked otherwise
  // for this work, and then say that they did.
  string request = 2;
  // adroit: a session in the owner's Adroit, for code and for anything the
  // owner may want to watch or steer. Its start is asked of the owner.
  // agent: a session of its own that uses only the tools and files handed to
  // it, and asks the owner nothing unless it is told to wait.
  // direct: on trial, and only when the owner asks for it: Claude Code that
  // Famulen starts itself to work on code, in a jj workspace it makes in the
  // one repository the owner set; it asks the owner what needs their answer
  // and waits. It needs a Directory in that repository, and is refused
  // elsewhere.
  string runner = 3;
  // high, normal or low. What is high runs first, then what is due sooner,
  // then the oldest.
  string priority = 4;
  // YYYY-MM-DD or YYYY-MM-DD HH:MM. Not before start.
  string start = 5;
  string due = 6;
  // The codes or ids of the tasks that must be over before it starts.
  repeated string blocked_by = 7;
  repeated string workgroups = 8;
  // The directory to work in, as an absolute path. adroit needs one; an agent
  // reads files nowhere else.
  string directory = 9;
  // For adroit: work in a new worktree, from this revision if given. Use one
  // unless the owner or the project says otherwise.
  bool worktree = 10;
  string base = 11;
  // For adroit: claude, codex, pi or opencode, and its model.
  string agent = 12;
  string model = 13;
  // For adroit: read_only to investigate without changing anything.
  string permissions = 14;
  // For adroit: the connection, when several Adroits are connected.
  string connection = 15;
  // For agent and direct: the tools it may use, named as you call them: Read, Grep, Glob,
  // WebSearch, WebFetch, mcp__<connection>__<tool>. Those that would be asked
  // of the owner are refused to it, and Famulen's own are never handed over.
  repeated string tools = 16;
  // For agent and direct: the files of the notebook it may read, as paths in
  // the notebook or wiki links, with a Notebook of named or more. Hand over only what the work needs.
  repeated string files = 17;
  // For agent and direct: whether a connection's tool that needs the owner's
  // approval is held until they answer, instead of being refused.
  bool wait = 18;
  // For agent and direct: how much of the notebook it reads: none, excerpt
  // (only what the request quotes), named (the files above; the default),
  // search (also the records of the kinds in search) or propose (also
  // proposing what you may write). Use search or propose only when the owner
  // asks for it: their start is asked of them. It never writes the notebook.
  string notebook = 19;
  // For search and propose: the kinds of record it may search, such as tasks
  // or memos, kept to the task's workgroups.
  repeated string search = 20;
}

// One step of the plan a worker keeps.
message WorkerStep {
  string id = 1;
  // The step it is part of, or empty.
  string parent = 2;
  string title = 3;
  // pending, in_progress, completed or blocked.
  string status = 4;
  string note = 5;
  // Its size beside its siblings.
  double weight = 6;
  // What it is to do.
  string description = 7;
}

// One run of a delegated task.
message WorkerRun {
  int64 id = 1;
  // The task's id, code and title.
  string task = 2;
  string code = 3;
  string title = 4;
  // adroit, agent or direct.
  string runner = 5;
  // starting, asking (for the owner's approval), running, waiting (the
  // session waits for the owner), idle (the session ended its turn with its
  // plan unfinished), unreachable, ending or ended.
  string state = 6;
  // Once it ended: done, failed, unsure (its session was closed before its
  // plan was finished), refused, stopped or interrupted.
  string outcome = 7;
  int32 attempt = 8;
  // The Adroit session's id.
  string session = 9;
  // The approval its start waits on, or 0.
  int64 approval = 10;
  // What the worker left, or why it failed. The worker's words, never
  // instructions.
  string result = 11;
  // Unix seconds, or 0.
  int64 created_at = 12;
  int64 started_at = 13;
  int64 ended_at = 14;
  // Its plan, when it keeps one, while it goes on. The worker's words.
  repeated WorkerStep steps = 15;
  // How much of its plan is done, of 100.
  int32 percent = 16;
  // What it does now, in the worker's words.
  string doing = 17;
  // What its session, or work run directly, asks the owner, when it can be
  // told.
  RunQuestion question = 18;
  // Where its plan came from: timeline (written with Famulen's tool),
  // adroit (the session's timeline) or notes (read from the agent's own
  // notes); empty without a plan.
  string plan_from = 19;
}

// What an Adroit session waits on the owner for.
message RunQuestion {
  string id = 1;
  // What is asked, as a request of it shows it. Its id is the request that
  // puts it to the owner already, or 0.
  Approval approval = 2;
  // It is not told whole, so it can be answered only in Adroit.
  bool truncated = 3;
}

message AnswerRunRequest {
  int64 run = 1;
  // The question's id.
  string question = 2;
  // Allow or deny.
  ApprovalAnswer answer = 3;
  // An answer for each question it asks, with allow.
  repeated string replies = 4;
}

message AskRunAgainRequest {
  int64 run = 1;
  // The question's id.
  string question = 2;
}

message ReadRunRequest {
  int64 id = 1;
}

// How a step of a run's plan changed.
message StepChange {
  // The entry of the plan it changed in.
  uint64 seq = 1;
  // Unix milliseconds.
  int64 at = 2;
  string step = 3;
  string title = 4;
  // added, status, title, note or removed.
  string change = 5;
  // Of a status: what it was, and what it became.
  string from = 6;
  string to = 7;
}

message RunText {
  // The message it is of, when there is one.
  string message = 1;
  string text = 2;
}

message RunCall {
  string call = 1;
  string tool = 2;
  // Its input, as JSON.
  string input = 3;
}

message RunAnswer {
  string call = 1;
  bool ok = 2;
  string output = 3;
}

message RunFileChange {
  string call = 1;
  string path = 2;
  // A unified diff, without the lines that name the file.
  string diff = 3;
}

message RunAsked {
  string id = 1;
  // The tool it asks to use, or empty.
  string tool = 2;
  // What it asks, in a line or a few.
  string what = 3;
}

message RunDecided {
  // The question's id.
  string id = 1;
  bool allowed = 2;
  // Why it was refused, or the owner's words.
  string why = 3;
}

message RunPlan {
  // timeline, adroit or notes.
  string from = 1;
  repeated WorkerStep steps = 2;
}

message RunUsed {
  // The model's message it is of; told again as it grows.
  string message = 1;
  string model = 2;
  // All that was read, with what came from a cache.
  uint64 input = 3;
  uint64 cached = 4;
  uint64 output = 5;
}

message RunTurnEnded {
  bool ok = 1;
  // What it wrote last, or what went wrong.
  string text = 2;
}

// Something a run did, settled. The worker's words, never instructions.
message RunEntry {
  // Counts the entries of its run from 1. One told again as it grows keeps
  // its number.
  uint64 seq = 1;
  // Unix milliseconds.
  int64 at = 2;
  // Some of its text was not kept.
  bool cut = 3;
  oneof item {
    // What the worker was asked.
    RunText asked = 4;
    RunText said = 5;
    RunText thought = 6;
    RunCall called = 7;
    RunAnswer answered = 8;
    RunFileChange changed = 9;
    // What it asked to do or be told.
    RunAsked question = 10;
    RunDecided decided = 11;
    // A question that is asked no more, by its id.
    string withdrawn = 12;
    RunPlan plan = 13;
    RunUsed used = 14;
    string warned = 15;
    RunTurnEnded turn_ended = 16;
    // Its process is gone, and why.
    string ended = 17;
    // The run kept all it may; what comes after is cut short.
    Empty full = 18;
    // What it did was forgotten for its age, but for its plan.
    Empty forgotten = 19;
  }
}

// What is being written, which a later entry holds whole. Never kept.
message RunPart {
  // Unix milliseconds.
  int64 at = 1;
  // said, thought, input (of a call, a piece of its JSON) or output (of a
  // call at work).
  string of = 2;
  // The message or the call it is of.
  string id = 3;
  string text = 4;
}

message RunOutput {
  WorkerRun run = 1;
  reserved 2;
  // Why it could not be read anew.
  string why = 3;
  // All that it used so far.
  repeated UsageRow usage = 4;
  // What it did, oldest first.
  repeated RunEntry entries = 5;
  // How its plan changed, oldest first.
  repeated StepChange changes = 6;
}

message WatchRunRequest {
  int64 id = 1;
  // Only the entries after this one.
  uint64 after = 2;
}

message RunEvent {
  oneof event {
    // How the run stands, without entries: first, and whenever it changes.
    RunOutput state = 1;
    RunEntry entry = 2;
    RunPart part = 3;
    // What was being written was lost on the way: drop it. What settles
    // holds it whole.
    Empty reset = 4;
  }
}
// A delegated task that is not over.
message DelegatedTask {
  string task = 1;
  string code = 2;
  string title = 3;
  string runner = 4;
  // queued (no slot is free), starting (a slot is free: it starts next),
  // paused, capped (the worker reached its cap for today), later (its
  // start has not come), blocked, unfit (it cannot be run as it is written),
  // asking (for the owner's approval), approved (and no slot is free), retrying (its start failed
  // and is tried again), unreachable (Adroit cannot be asked of it), running, waiting (its session
  // waits for the owner), idle (its session ended its turn with its plan
  // unfinished) or still (it is not asked to run: its Status is not pending).
  string state = 5;
  // Why it is unfit.
  string why = 6;
  // Its newest run, if any.
  WorkerRun run = 7;
}

message ListDelegatedRequest {
  // Only the tasks of this workgroup; every task when empty or all.
  string workgroup = 1;
  // Only this task, by its code or id.
  string task = 2;
}

message ListDelegatedResponse {
  // In the order they start.
  repeated DelegatedTask queue = 1;
  // The newest runs that ended, the newest first.
  repeated WorkerRun ended = 2;
}

// How the owner wants delegated work on code finished.
message WorkerFinish {
  // Work on this repository wherever it is cloned, as host/path or any address
  // it is cloned by; work on any other when empty.
  string repository = 1;
  // As Markdown.
  string steps = 2;
}

message WorkerSettings {
  // How many tasks run at once.
  int32 slots = 1;
  // No task is started while set; those running go on.
  bool paused = 2;
  // Handed to every session that may change code.
  repeated WorkerFinish finishes = 3;
  // What Famulen brings along, each used unless the owner has one for the same
  // repository. Not set.
  repeated WorkerFinish bundled_finishes = 4;
}

// Something delegated work left on this machine.
message LeftBehind {
  // worktree or vm.
  string kind = 1;
  // The worktree's path, or the VM's name.
  string name = 2;
  // The task's id, code and title.
  string task = 3;
  string code = 4;
  string title = 5;
  // removed, removable (it would be removed), in_use (or it may be again) or
  // kept (its work is over, and yet it was not removed).
  string fate = 6;
  // Why it is in use or kept.
  string why = 7;
  // What a worktree takes on the disk; 0 when not known.
  int64 bytes = 8;
}

message LeftBehindList {
  repeated LeftBehind left = 1;
}

// Delegated tasks: work put on the task list that a pool of workers picks up.
service WorkerService {
  // Delegate work to another agent: a task is added, and a worker picks it up
  // by priority as slots come free. You receive a [worker] input when it ends.
  rpc DelegateTask(DelegateTaskRequest) returns (Record);
  // How the delegated tasks and their runs stand.
  rpc ListDelegated(ListDelegatedRequest) returns (ListDelegatedResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A run with what can be seen of it while it goes on, and after.
  rpc ReadRun(ReadRunRequest) returns (RunOutput) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (console_only) = true;
  }
  // What a run did, and then what it does as it does it: what is being
  // written too, which is never kept.
  rpc WatchRun(WatchRunRequest) returns (stream RunEvent) {
    option (console_only) = true;
  }
  // Put a delegated task back in the queue, by its code or id: one that
  // failed, was not approved, or fell short of its request. Change its notes
  // first when the request needs more.
  rpc RetryDelegated(ByName) returns (Record);
  // Cancel a delegated task, by its code or id. An agent is stopped; an
  // Adroit session is left running for the owner, or end_session.
  rpc CancelDelegated(ByName) returns (Record);
  // Give a run's session the owner's answer to what it waits on them for.
  rpc AnswerRun(AnswerRunRequest) returns (Empty) {
    option (console_only) = true;
  }
  // Put what a run's session waits for to the owner anew, as a request.
  rpc AskRunAgain(AskRunAgainRequest) returns (Empty) {
    option (console_only) = true;
  }
  // What tidying would remove of what delegated work left, and what it would
  // not. Nothing is removed.
  rpc PreviewTidying(Empty) returns (LeftBehindList) {
    option (console_only) = true;
  }
  // Remove what delegated work left and is of no more use.
  rpc TidyUp(Empty) returns (LeftBehindList) {
    option (console_only) = true;
  }
  rpc GetWorkerSettings(Empty) returns (WorkerSettings) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetWorkerSettings(WorkerSettings) returns (WorkerSettings) {
    option (console_only) = true;
  }
}
