syntax = "proto3";

package famulen.v1;

import "famulen/v1/common.proto";
import "famulen/v1/options.proto";

enum Speaker {
  SPEAKER_UNSPECIFIED = 0;
  SPEAKER_OWNER = 1;
  SPEAKER_AIDE = 2;
}

// A file the owner attached to a message.
message Attachment {
  // Where it is: /attachments/<id>. Empty when it did not arrive, or not yet.
  string id = 1;
  string name = 2;
  // What it is, by what it holds.
  string mime = 3;
  int64 size = 4;
  // Why it did not arrive; empty when it did.
  string problem = 5;
}

// The message another one replies to.
message RepliedTo {
  int64 id = 1;
  Speaker who = 2;
  // Its beginning.
  string text = 3;
}

// One message in the conversation on the console.
message ConsoleMessage {
  int64 id = 1;
  // Unix seconds.
  int64 at = 2;
  Speaker who = 3;
  string text = 4;
  // The workgroup it was said in.
  string workgroup = 5;
  // Where it came from (コンソール, Slack · …), for the owner's messages.
  string origin = 6;
  // What the owner was looking at when they said it.
  string about = 7;
  // A section the reply suggests opening: calendar, task, memos, …
  string open = 8;
  repeated Attachment attachments = 9;
  // The message it replies to; unset when that one is not shown in the
  // workgroup that is read.
  RepliedTo reply_to = 10;
  // The message its thread begins with; 0 when it replies to none.
  int64 thread = 11;
  // The secretary's conversation it is in; 0 when that is not known, as of one
  // not taken up yet.
  int64 conversation = 12;
}

message ListMessagesRequest {
  string workgroup = 1;
  // Only messages older than this id; 0 is the newest.
  int64 before = 2;
  int32 limit = 3;
  // Only the thread of this message, from the message the
  // thread begins with, and not a page of it. 0 is the conversation.
  int64 thread = 4;
  // Only this conversation's, and not a page of it, however many threads it
  // ran through, on Slack as well. 0 is every one.
  int64 conversation = 5;
}

message ListMessagesResponse {
  // Oldest first.
  repeated ConsoleMessage messages = 1;
  // Whether older messages remain.
  bool more = 2;
}

message ListLinkPreviewsRequest {
  // The message whose links are told.
  int64 message = 1;
}

// What a page a link leads to tells of itself.
message LinkPreview {
  string url = 1;
  string site = 2;
  string title = 3;
  string description = 4;
  // Where its picture is: /link-images/<id>. Empty when it has none.
  string image = 5;
}

message ListLinkPreviewsResponse {
  // In the order the links come; a page that tells nothing is left out.
  repeated LinkPreview previews = 1;
}

// What turns of a conversation used.
message ConversationSpent {
  int64 turns = 1;
  // What the model read, the cache included.
  int64 input_tokens = 2;
  // Of the input, what was read from the cache.
  int64 cached_tokens = 3;
  // Of the input, what was written to the cache.
  int64 cache_write_tokens = 4;
  int64 output_tokens = 5;
}

// One of the secretary's conversations: it knows what was said in it, and of
// the others only what memory holds.
message Conversation {
  int64 id = 1;
  // How what it began with begins.
  string title = 2;
  // What it began with, as of an input: console, slack, schedule, …
  string source = 3;
  // The one thing that tells such a source apart.
  string detail = 4;
  // The workgroup it began in; empty before its first turn.
  string workgroup = 5;
  // Unix seconds.
  int64 opened_at = 6;
  // When a turn of it last began or ended, in Unix seconds.
  int64 used_at = 7;
  // How many tokens the model read when it was last called; it is compacted
  // by itself when that grows long.
  int64 context_tokens = 8;
  // What it used, in all or in the period that was asked for.
  ConversationSpent spent = 9;
  // Whether a turn of it runs now.
  bool running = 10;
  // Whether something is still to be done in it.
  bool waiting = 11;
  // What was said last in it, as far as the workgroup shows it.
  ConsoleMessage last = 12;
}

message ListConversationsRequest {
  // Only those begun in what this workgroup shows; empty is every one.
  string workgroup = 1;
  // Only those used before this one; 0 begins with the one used last.
  int64 before = 2;
  int32 limit = 3;
}

message ListConversationsResponse {
  // The one used last first.
  repeated Conversation conversations = 1;
  // Whether more remain.
  bool more = 2;
}

message SendRequest {
  string text = 1;
  string workgroup = 2;
  // What the owner is looking at, in words: "カレンダー · 週 · 11月21日 – 27日".
  string view = 3;
  // Something the owner picked on screen to talk about.
  string selection = 4;
  // The files attached, by the ids POST /attachments gave. With one, text may
  // be empty.
  repeated string attachments = 5;
  // The message it replies to; 0 is none.
  int64 reply_to = 6;
  // The secretary's conversation to go on with, for what is no reply; 0 goes
  // on with the one the owner was in a moment ago, or begins one.
  int64 conversation = 7;
  // Begin a conversation, for what is no reply.
  bool new_conversation = 8;
}

message PostMessageRequest {
  string text = 1;
  // A section to suggest opening alongside: calendar, task, memos, parties,
  // things, contracts, memory.
  string open = 2;
  // The message it replies to, to say it in that message's thread. 0 replies
  // to the owner's message being answered, when that one is itself a reply,
  // and to the one the owner asked with when something comes back to it later.
  int64 reply_to = 3;
}

// A tool call waiting for the owner's yes or no.
message Approval {
  int64 id = 1;
  string tool = 2;
  // The call's input, as JSON.
  string input = 3;
  // pending, approved, rejected or always_allowed.
  string status = 4;
  int64 created_at = 5;
  // The owner is asked of every such call: it cannot be allowed from now on.
  bool once = 6;
  // What the owner answers instead of approving, if anything.
  repeated ApprovalQuestion questions = 7;
  // What the secretary says of it, beside what is asked.
  string summary = 8;
  // What it does, in the owner's words.
  string deed = 20;
  // Where it does it: the service, and the account.
  string place = 21;
  // What it is given, a row for each; empty when it is not given named things.
  repeated ApprovalGiven given = 22;
}

// One thing a held call is given.
message ApprovalGiven {
  string name = 1;
  string text = 2;
  // It is read as it is typed, such as a command.
  bool code = 3;
  // What it is made of, when it is not one text.
  repeated ApprovalGiven rows = 4;
}

message ApprovalQuestion {
  string question = 1;
  repeated ApprovalChoice choices = 2;
  // Several may be chosen.
  bool several = 3;
}

message ApprovalChoice {
  string label = 1;
  string description = 2;
}

// An input whose turn was cut off while a tool call was in flight, kept
// until the owner says whether to run it again.
message HeldInput {
  int64 id = 1;
  string text = 2;
  // Unix seconds, when it arrived.
  int64 at = 3;
}

message Inbox {
  repeated Approval approvals = 1;
  repeated HeldInput held = 2;
  // Accounts inferred to belong to a party, waiting for 同じ人 / 別の人.
  repeated AccountQuestion accounts = 3;
}

message AccountQuestion {
  string account = 1;
  string party = 2;
  string party_name = 3;
  string service = 4;
  string handle = 5;
  string how = 6;
}

enum ApprovalAnswer {
  APPROVAL_ANSWER_UNSPECIFIED = 0;
  APPROVAL_ANSWER_ALLOW = 1;
  APPROVAL_ANSWER_DENY = 2;
  // Allow this call and every later call of the same tool.
  APPROVAL_ANSWER_ALWAYS = 3;
}

message AnswerApprovalRequest {
  int64 id = 1;
  ApprovalAnswer answer = 2;
  // The answers to its questions, one for each, when it asks any.
  repeated string replies = 3;
}

message AnswerHeldRequest {
  int64 id = 1;
  // True runs it again; false drops it.
  bool go_on = 2;
}

// Whether the secretary is working.
message Status {
  // running or waiting.
  string state = 1;
  int32 pending_inputs = 2;
  // What it is working on now, in words.
  string doing = 3;
}

// What the secretary is doing for the owner, shown in the conversation until
// the answer comes.
message Working {
  // In words; empty when nothing is shown.
  string text = 1;
  // How long it is shown unless told again.
  int32 seconds = 2;
}

// Something changed that a screen may show.
message ConsoleEvent {
  oneof event {
    ConsoleMessage message = 1;
    // The inbox (approvals, held inputs, account questions) changed.
    Empty inbox = 2;
    // Records or settings changed, or may have: told also when the stream
    // begins and when changes were missed.
    Empty records = 3;
    // What the secretary is doing for the owner: told also when the stream
    // begins.
    Working working = 4;
  }
}

// Something that reached the secretary to act on.
message InputItem {
  int64 id = 1;
  // Unix seconds, when it arrived.
  int64 at = 2;
  // Where it came from: console, slack, schedule, wake, approval, arrival,
  // lookout or worker.
  string source = 3;
  // More about where: the routine's name, the lookout's source, the Slack
  // channel, the connection something arrived on, the delegated task. Empty when there is nothing more.
  string detail = 4;
  // owner, other or system.
  string sender = 5;
  string text = 6;
  // pending, running, done, held or failed.
  string status = 7;
}

message ListInputsRequest {
  // How many, newest first; 0 is 15.
  int32 limit = 1;
  // Only inputs older than the one with this id; 0 from the newest.
  int64 before = 2;
}

message ListInputsResponse {
  // Newest first.
  repeated InputItem inputs = 1;
  // Older inputs remain past this page.
  bool more = 2;
}

message SubscribeEventsRequest {
  // Messages of this workgroup only; empty is all.
  string workgroup = 1;
}

// The conversation with the secretary and what waits for the owner.
service ConsoleService {
  // The conversation, oldest first.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The secretary's conversations.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // What the pages the links in a message lead to tell of themselves.
  rpc ListLinkPreviews(ListLinkPreviewsRequest) returns (ListLinkPreviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (console_only) = true;
  }
  // The owner says something to the secretary.
  rpc Send(SendRequest) returns (ConsoleMessage) {
    option (console_only) = true;
  }
  // The secretary says something to the owner on the console.
  rpc PostMessage(PostMessageRequest) returns (ConsoleMessage);
  // Approvals, held inputs and account questions waiting for the owner.
  rpc GetInbox(Empty) returns (Inbox) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc AnswerApproval(AnswerApprovalRequest) returns (Empty) {
    option (console_only) = true;
  }
  rpc AnswerHeld(AnswerHeldRequest) returns (Empty) {
    option (console_only) = true;
  }
  rpc GetStatus(Empty) returns (Status) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The latest inputs that reached the secretary, with how far each got.
  rpc ListInputs(ListInputsRequest) returns (ListInputsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Every change as it happens, until the caller goes away.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream ConsoleEvent) {
    option (console_only) = true;
  }
}
